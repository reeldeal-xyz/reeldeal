# Only settings that differ from the defaults. Sized for the shared t3.xlarge (4 vCPU / 16 GB),
# which also runs the pipeline API, its daily xarray build and the Astro app.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

max_connections = 50
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB

shared_preload_libraries = 'pg_stat_statements'

log_timezone = 'UTC'
timezone = 'UTC'
log_min_duration_statement = 1000
log_connections = off
