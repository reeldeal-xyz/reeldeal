# postgres is superuser and only logs in over the local socket (docker compose exec -u postgres db psql).
# Every other role uses a password over the reeldeal network or the host's 127.0.0.1:5432.
# TYPE  DATABASE  USER      ADDRESS    METHOD
local   all       postgres             peer
local   all       all                  scram-sha-256
host    all       postgres  all        reject
host    all       all       all        scram-sha-256
