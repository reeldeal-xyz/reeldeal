[project]
name = "pipeline"
version = "0.1.0"
description = "Satellite imagery analysis pipeline for aquaculture risk (heat, HAB, storm)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "geojson-pydantic>=1.1",
]

[project.scripts]
pipeline-serve = "pipeline.serve:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
