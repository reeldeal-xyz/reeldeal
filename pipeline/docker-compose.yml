# Pipeline API behind Caddy (automatic HTTPS). See DEPLOY.md. Caddy also fronts the web app at app.<host>.
services:
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}   # set by the deploy workflow; /health reports it
    image: pipeline-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./out:/app/out
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # A directory, not the file: git replaces files on checkout and a file mount would keep the old one.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - reeldeal   # reaches the web app (frontend/docker-compose.yml) as web:4321

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  reeldeal:
    external: true   # shared with db/ and frontend/; created by their up scripts or the deploy
