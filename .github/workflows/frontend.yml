name: Frontend
on:
  pull_request:
    paths: ['frontend/**', 'packages/shared/src/**', 'package.json', 'bun.lock', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'packages/shared/src/**', 'package.json', 'bun.lock', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run frontend:check
      - run: bun run --cwd frontend test
      - run: bun run frontend:build
      - run: bun run --cwd frontend smoke:built
      - run: bun run storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: frontend/storybook-static
