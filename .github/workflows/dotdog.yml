name: Dotdog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  map-and-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run dog:test
      - run: bunx --no-install tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --types bun --skipLibCheck scripts/dog-*.ts
      - run: bun run dog:map
      - run: bun run dog:check
      - run: git diff --exit-code
