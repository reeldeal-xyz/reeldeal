# Build and smoke-test the Astro web app's container on PRs; on push to main, deploy it to the EC2 instance
# via SSM Run Command (frontend/DEPLOY.md). Separate from the pipeline and database deploys; Caddy (pipeline/)
# serves it at app.<SITE_ADDRESS>. Source checks (astro check, tests, Storybook) stay in frontend.yml.
# Needs repo variables AWS_DEPLOY_ROLE_ARN and EC2_INSTANCE_ID.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - "packages/shared/package.json"
      - "web/package.json"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - "packages/shared/package.json"
      - "web/package.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the container
        run: |
          echo "LEGACY_WEB_ORIGIN=https://legacy.example" > frontend/.env
          GIT_SHA=${{ github.sha }} frontend/deploy/up.sh
      - name: Smoke-test routes through the network, as Caddy sees them
        run: |
          probe() { docker run --rm --network reeldeal curlimages/curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://web:4321$1"; }
          [ "$(probe /health)" = "200 " ]
          [ "$(probe /workshop)" = "200 " ]
          [ "$(probe '/map?x=1')" = "307 https://legacy.example/map?x=1" ]
          [ "$(probe /api/world)" = "404 " ]
          echo "routes ok"
      - if: failure()
        run: docker compose -f frontend/docker-compose.yml logs --no-color

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shares the instance checkout with deploy-pipeline.yml and deploy-db.yml, so they queue behind each other.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Runs on the instance as ubuntu. up.sh fails the deploy if the container never gets healthy or
          # /health doesn't report the commit we just pushed.
          script="set -e
          cd /home/ubuntu/reeldeal
          git fetch -q origin $BRANCH
          git checkout -q -f -B $BRANCH $SHA
          test -f frontend/.env
          GIT_SHA=$SHA frontend/deploy/up.sh
          docker image prune -f"
          params=$(jq -nc --arg s "$script" '{commands: ["sudo -u ubuntu -H bash -c \(($s | @sh))"]}')

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy web $BRANCH@${SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd_id"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]
