# Test the pipeline on PRs to main; on push to main, also deploy it to the EC2 instance via SSM Run Command
# (pipeline/DEPLOY.md §5). Needs repo variables AWS_DEPLOY_ROLE_ARN and EC2_INSTANCE_ID. No stored AWS or SSH keys:
# GitHub OIDC, and the role only trusts refs/heads/main.
name: deploy-pipeline

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/deploy-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/deploy-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Start migrated PostGIS for integration tests
        run: |
          ./scripts/testdb.sh up
          echo "PIPELINE_TEST_DATABASE_URL=postgresql://pipeline:test@127.0.0.1:55432/reeldeal" >> "$GITHUB_ENV"
      - run: uv run pytest
      - name: Stop test database
        if: always()
        run: ./scripts/testdb.sh down

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys are serialized with each other and with deploy-db.yml (same checkout on the instance);
    # PR test runs are not held up by them.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Runs on the instance as ubuntu. --wait fails the deploy if the api healthcheck never passes;
          # the last check fails it if /health isn't reporting the commit we just pushed.
          script="set -e
          cd /home/ubuntu/reeldeal
          git fetch -q origin $BRANCH
          git checkout -q -f -B $BRANCH $SHA
          python3 pipeline/scripts/prepare_runtime_env.py
          cd pipeline
          docker network inspect reeldeal >/dev/null 2>&1 || docker network create reeldeal
          GIT_SHA=$SHA docker compose up -d --build --wait
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker compose exec -T api python -c \"import json, urllib.request; c = json.load(urllib.request.urlopen('http://127.0.0.1:8787/health'))['commit']; assert c == '$SHA', c; print('health reports', c)\"
          docker compose exec -T api python -c \"import json, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=15)); assert r['status'] == 'ready'; print('database ready; live plots:', r['plotCount'])\"
          docker image prune -f"
          params=$(jq -nc --arg s "$script" '{commands: ["sudo -u ubuntu -H bash -c \(($s | @sh))"]}')

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $BRANCH@${SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]
