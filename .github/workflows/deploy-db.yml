# Test the database (db/) on PRs to main; on push to main, snapshot its EBS volume and deploy it to the EC2
# instance via SSM Run Command (db/README.md §9). Separate from deploy-pipeline.yml: a pipeline deploy never
# restarts the database. Needs repo variables AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID and DB_VOLUME_ID.
name: deploy-db

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - ".github/workflows/deploy-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "db/**"
      - ".github/workflows/deploy-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Fresh database from .env.example: bootstrap, migrations, tests, then a backup/restore round trip.
      - run: db/scripts/up.sh
        env:
          CI: "true"
      - run: docker compose -f db/docker-compose.yml exec -T backup backup.sh && db/scripts/restore.sh latest
      - if: failure()
        run: docker compose -f db/docker-compose.yml logs --no-color

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shares the instance checkout with deploy-pipeline.yml, so they queue behind each other.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Snapshot the data volume
        env:
          VOLUME_ID: ${{ vars.DB_VOLUME_ID }}
          SHA: ${{ github.sha }}
        run: |
          # Crash-consistent point to roll back to if a migration goes wrong. Keep 14 days of them.
          aws ec2 create-snapshot --volume-id "$VOLUME_ID" \
            --description "reeldeal-db before deploy ${SHA::7}" \
            --tag-specifications "ResourceType=snapshot,Tags=[{Key=reeldeal,Value=db-predeploy},{Key=commit,Value=$SHA}]" \
            --query SnapshotId --output text
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%S)
          for s in $(aws ec2 describe-snapshots --owner-ids self \
              --filters Name=tag:reeldeal,Values=db-predeploy Name=volume-id,Values="$VOLUME_ID" \
              --query "Snapshots[?StartTime<'$cutoff'].SnapshotId" --output text); do
            aws ec2 delete-snapshot --snapshot-id "$s" && echo "deleted old $s"
          done

      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Runs on the instance as ubuntu. up.sh fails the deploy if the db never gets healthy, a migration
          # fails, or the tests (which roll back) fail against the live database.
          script="set -e
          cd /home/ubuntu/reeldeal
          git fetch -q origin $BRANCH
          git checkout -q -f -B $BRANCH $SHA
          db/scripts/up.sh
          docker compose -f db/docker-compose.yml exec -T -u postgres db psql -d reeldeal -Atc 'select max(version) from dbmate.schema_migrations' | sed 's/^/schema version /'
          docker image prune -f"
          params=$(jq -nc --arg s "$script" '{commands: ["sudo -u ubuntu -H bash -c \(($s | @sh))"]}')

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy db $BRANCH@${SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]
